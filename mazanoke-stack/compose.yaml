# MAZANOKE image optimizer — see README.md for the operating notes.
#
# The container is a stock `nginx:alpine` serving prebuilt static assets: the
# optimizer runs entirely in the browser, images never leave the client, and
# there is no backend, no database, and no persistent state. That is why this
# stack has no volumes and no uid/permission concerns.
#
# Upstream ships `ghcr.io/civilblur/mazanoke` (multi-arch), so nothing is built
# here — the tag is pulled. Upstream's own compose.yaml is the same one service
# on port 3474; this file only adds the hub-playground conventions.
#
# Note: the root filesystem must stay writable. scripts/metatags.sh runs at every
# start and copies index.html.template over the served index.html, so
# `read_only: true` would break the container unless a tmpfs were mounted over
# /usr/share/nginx/html.
services:
  mazanoke:
    image: ghcr.io/civilblur/mazanoke:${MAZANOKE_IMAGE_TAG:-v1.1.7}
    container_name: hub-playground-mazanoke
    restart: unless-stopped
    # Upstream's CMD is deliberately left alone. It reads like
    # `/bin/sh -c "basicauth.sh; nginx -g 'daemon off;'"` would leave a shell as
    # PID 1, but BusyBox ash execs the last command of a `-c` string, so nginx
    # really is PID 1 (verified on the deployment: `cat /proc/1/comm` → nginx,
    # and a stop finishes in ~0.6 s instead of waiting out the grace period).
    # Keeping it also keeps the `;`: a failing basicauth.sh cannot stop nginx
    # from starting, which `&&` would have broken.
    ports:
      # The container always listens on 80 — upstream's config/nginx.conf hard-codes
      # it, so only the host side is configurable.
      - "${MAZANOKE_BIND_ADDRESS:-0.0.0.0}:${MAZANOKE_PORT:-3474}:80"
    environment:
      # Basic auth is applied only when BOTH are non-empty (upstream contract;
      # see docs/configuration.md). Both are empty in .env.example, so
      # the playground instance is open — read "Basic auth" in the README before
      # enabling it, because the password then lives in the container environment.
      USERNAME: ${MAZANOKE_USERNAME:-}
      PASSWORD: ${MAZANOKE_PASSWORD:-}
      # Injects the OFFICIAL mazanoke.com SEO/social metatags into the served HTML.
      # Those describe the upstream hosted product, not this instance, so the knob
      # stays off here; only the literal string "true" turns them on.
      METATAGS: ${MAZANOKE_METATAGS:-false}
    healthcheck:
      # /manifest.json is served unconditionally, so the probe works whether or
      # not basic auth is on. `wget` is BusyBox's, from the Alpine base.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/manifest.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      # nginx drops its workers to the `nginx` user with setuid/setgid syscalls,
      # not via a setuid binary, so this does not break it.
      - no-new-privileges:true
    # One master plus `worker_processes auto` workers (10 on this host) — 256 is
    # generous headroom without being unbounded.
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
