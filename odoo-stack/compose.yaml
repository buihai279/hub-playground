# Odoo 20 — open-source ERP/CRM (community edition).
#
# Deploy stack for hub-playground. Runs the official odoo:20 image against a
# dedicated PostgreSQL 17 container. Both data sets live in Docker named
# volumes, so no host-side ownership juggling is needed: the odoo image runs as
# uid 101 and the postgres image as uid 999, neither of which matches a typical
# host user.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d
#
# Upstream source is vendored in the ../odoo git submodule.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_DB=postgres is the documented Odoo pairing: the image skips
      # creating it and Odoo uses it as the maintenance database for listing
      # and creating tenant databases.
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "odoo"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${ODOO_PORT:-8069}:8069"
    environment:
      # The image entrypoint turns these into --db_host/--db_port/--db_user/
      # --db_password unless they are already set in /etc/odoo/odoo.conf.
      HOST: "db"
      PORT: "5432"
      USER: "odoo"
      PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    # The entrypoint drops the leading "odoo" and appends the db args, so these
    # are extra CLI options on top of the image defaults.
    command:
      - "odoo"
      - "--without-demo=all"
      - "--workers=0"
      - "--admin-passwd=${ODOO_MASTER_PASSWORD:?ODOO_MASTER_PASSWORD must be set}"
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons

volumes:
  odoo-db:
  odoo-data:
  odoo-addons:
